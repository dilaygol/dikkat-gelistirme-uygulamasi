<div class="page-frame">

    <div class="frame-top">
        <app-activity-header icons="🏆"
            instruction="Aşağıdaki sporlarla ilgili olan nesneleri eşleyin. Önce nesneye, sonra spora tıklayın.">
        </app-activity-header>
    </div>

    <div class="frame-middle">

        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="sport-container">

                <!-- Top: Sports -->
                <div class="sports-row">
                    @for (sport of sports; track sport.id) {
                    <div class="sport-card"
                         [class.assigned]="isSportAssigned(sport.id)"
                         [class.correct]="feedbackState === 'correct'"
                         (click)="assignToSport(sport.id)">
                        <div class="sport-icon">{{ sport.emoji }}</div>
                        <div class="sport-name">{{ sport.name }}</div>
                        @if (isSportAssigned(sport.id)) {
                        <div class="assigned-badge">
                            <span class="material-icons">link</span>
                        </div>
                        }
                    </div>
                    }
                </div>

                <!-- Divider -->
                <div class="match-divider">
                    <span class="divider-text">Nesneleri yukarıdaki sporlarla eşleyin</span>
                </div>

                <!-- Bottom: Objects -->
                <div class="objects-row">
                    @for (obj of objects; track obj.id) {
                    <div class="object-card"
                         [class.active]="selectedObjectId === obj.id"
                         [class.matched]="obj.assignedSportId !== null"
                         [class.correct]="feedbackState === 'correct' && obj.assignedSportId === obj.correctSportId"
                         [class.error]="feedbackState === 'wrong' && obj.assignedSportId !== null && obj.assignedSportId !== obj.correctSportId"
                         (click)="selectObject(obj.id)">
                        <div class="object-icon">{{ obj.emoji }}</div>
                        <div class="object-name">{{ obj.name }}</div>
                        @if (getSportForObject(obj.id); as sport) {
                        <div class="linked-sport">→ {{ sport.name }}</div>
                        }
                    </div>
                    }
                </div>

            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="goNext()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>

    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="clearSelection()" (check)="checkAnswer()" />
    </div>

</div>

<app-shared-feedback></app-shared-feedback>
