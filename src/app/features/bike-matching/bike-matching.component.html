<div class="page-frame">
    <div class="frame-top">
        <app-activity-header icons="" instruction="Aşağıdaki bisikletleri eşleştirin."></app-activity-header>
    </div>

    <div class="frame-middle">
        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="match-container">
                <!-- Left column -->
                <div class="bike-col left-col">
                    @for (bike of leftBikes; track $index) {
                    <div class="bike-slot"
                        [class.selected]="bike.isSelected"
                        [class.matched]="bike.isMatched"
                        [class.shake]="bike.isWrong"
                        [class.hint]="showHint && !bike.isMatched && $index === hintLeftIndex"
                        (click)="selectLeft($index)">
                        <img [src]="bike.image" [alt]="bike.color + ' bisiklet'" class="bike-img" draggable="false">
                    </div>
                    }
                </div>

                <!-- SVG overlay for connection lines -->
                <svg class="lines-svg"
                    [attr.width]="CONTAINER_WIDTH"
                    [attr.height]="CONTAINER_HEIGHT"
                    [attr.viewBox]="'0 0 ' + CONTAINER_WIDTH + ' ' + CONTAINER_HEIGHT">

                    <!-- Anchor dots on left -->
                    @for (bike of leftBikes; track $index) {
                    @if (!bike.isMatched) {
                    <circle
                        [attr.cx]="LEFT_ANCHOR_X"
                        [attr.cy]="getItemCenterY($index)"
                        r="5"
                        [attr.fill]="bike.isSelected ? '#6366f1' : '#cbd5e1'"
                        class="anchor-dot" />
                    }
                    }

                    <!-- Anchor dots on right -->
                    @for (bike of rightBikes; track $index) {
                    @if (!bike.isMatched) {
                    <circle
                        [attr.cx]="RIGHT_ANCHOR_X"
                        [attr.cy]="getItemCenterY($index)"
                        r="5"
                        fill="#cbd5e1"
                        class="anchor-dot" />
                    }
                    }

                    <!-- Match lines -->
                    @for (line of matchLines; track $index) {
                    <line
                        [attr.x1]="LEFT_ANCHOR_X"
                        [attr.y1]="getItemCenterY(line.leftIndex)"
                        [attr.x2]="RIGHT_ANCHOR_X"
                        [attr.y2]="getItemCenterY(line.rightIndex)"
                        [attr.stroke]="getLineColor(line.color)"
                        stroke-width="4"
                        stroke-linecap="round"
                        class="match-line" />
                    }
                </svg>

                <!-- Right column -->
                <div class="bike-col right-col">
                    @for (bike of rightBikes; track $index) {
                    <div class="bike-slot"
                        [class.matched]="bike.isMatched"
                        [class.shake]="bike.isWrong"
                        [class.hint]="showHint && !bike.isMatched && $index === hintRightIndex"
                        [class.clickable]="selectedLeftIndex !== null && !bike.isMatched"
                        (click)="selectRight($index)">
                        <img [src]="bike.image" [alt]="bike.color + ' bisiklet'" class="bike-img" draggable="false">
                    </div>
                    }
                </div>
            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="goNext()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>
    </div>

    <div class="frame-bottom">
        <app-action-buttons [checkAlwaysDisabled]="true" (reset)="clearSelection()" />
    </div>
</div>
