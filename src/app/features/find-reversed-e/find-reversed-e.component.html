<div class="page-frame">
    <div class="frame-top">
        <div class="instruction-card">
            <h1 class="instruction-text">
                <span class="instruction-icon">👁️</span>
                "e" sesinin tersini, verilen seslerin içinden bulun ve işaretleyin.
            </h1>
        </div>
    </div>

    <div class="frame-middle">
        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="letter-grid">
                @for (cell of grid; track cell.id) {
                <div class="letter-cell hover" [class.selected]="isSelected(cell.id)" [class.shake]="cell.isShaking"
                    [class.hint]="isHint(cell)" role="button" tabindex="0" (click)="toggleSelection(cell.id)"
                    (keydown.enter)="toggleSelection(cell.id)"
                    [attr.aria-label]="(cell.isReversed ? 'Ters ' : 'Düz ') + 'e harfi'"
                    [attr.aria-pressed]="isSelected(cell.id)" [style.color]="cell.color">

                    <span [class.reversed]="cell.isReversed">e</span>
                </div>
                }
            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="goNext()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>
    </div>

    <div class="frame-bottom">
        <app-action-buttons [isCompleted]="isNextUnlocked" (reset)="clearSelection()" (check)="checkAnswer()" />
    </div>
</div>
