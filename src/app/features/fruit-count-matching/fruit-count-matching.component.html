<div class="page-frame">
        <div class="frame-top">
        <app-activity-header icons="" instruction="Aşağıdaki meyvelerden sayıları aynı olanları eşleştirin."></app-activity-header>
    </div>

    <div class="frame-middle">
        <button class="nav-btn" (click)="goPrev()" aria-label="Önceki etkinlik">
            <span class="material-icons">arrow_back</span>
        </button>

        <div class="game-content">
            <div class="game-board">
                <!-- Left Column: Apples -->
                <div class="fruits-column left-column">
                    @for (group of leftGroups; track group.id) {
                    <div class="fruit-group hover" [class.selected]="group.isSelected" [class.matched]="group.isMatched"
                        [class.shake]="group.isWrong"
                        [class.hint]="showHint && !group.isMatched && group.count === hintTargetCount && !group.isSelected"
                        (click)="selectGroup(group)">
                        @for (item of getArray(group.count); track $index) {
                        <span class="fruit-icon">🍎</span>
                        }
                    </div>
                    }
                </div>

                <!-- Right Column: Oranges -->
                <div class="fruits-column right-column">
                    @for (group of rightGroups; track group.id) {
                    <div class="fruit-group hover" [class.selected]="group.isSelected" [class.matched]="group.isMatched"
                        [class.shake]="group.isWrong"
                        [class.hint]="showHint && !group.isMatched && group.count === hintTargetCount && !group.isSelected"
                        (click)="selectGroup(group)">
                        @for (item of getArray(group.count); track $index) {
                        <span class="fruit-icon">🍊</span>
                        }
                    </div>
                    }
                </div>
            </div>
        </div>

        <button class="nav-btn" [class.locked]="!isNextUnlocked" [disabled]="!isNextUnlocked" (click)="goNext()"
            aria-label="Sonraki etkinlik">
            <span class="material-icons">arrow_forward</span>
        </button>
    </div>

    <div class="frame-bottom">
        <app-action-buttons [checkAlwaysDisabled]="true" (reset)="clearSelection()" />
    </div>
</div>
